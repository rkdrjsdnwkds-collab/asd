<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GitHub와 Netlify 연동을 배우는 첫 웹사이트" />
  <title>나의 첫 배포 사이트</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <span class="badge">GitHub + Netlify 실습</span>
    <h1>안녕하세요! 👋</h1>
    <p>GitHub와 Netlify로 배포하는 나의 첫 웹사이트입니다.</p>
    <!-- 버전을 수정한 뒤 GitHub에 올려 자동 배포를 확인하세요. -->
    <p class="version">현재 버전: 1.0</p>
    <button type="button" id="hello-button">눌러 보세요</button>
    <p id="message" aria-live="polite"></p>
    <section>
      <h2>오늘 배우는 것</h2>
      <ul>
        <li>HTML로 웹페이지 내용 만들기</li>
        <li>CSS로 색상과 모양 꾸미기</li>
        <li>JavaScript로 버튼 동작 만들기</li>
        <li>GitHub에 파일을 올리고 Netlify로 배포하기</li>
      </ul>
    </section>
    <footer>만든 사람: 여러분의 이름</footer>
  </main>
</body>
</html>
